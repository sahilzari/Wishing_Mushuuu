<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--hand:"Bradley Hand","Noteworthy","Segoe Print","Comic Sans MS",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}

body{position:fixed;inset:0;width:100%;background:#1d1030;color:#fff}
h1,h2,h3,p,figure{margin:0}
#app{position:fixed;inset:0;height:100vh;height:100dvh}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--st) + 56px) 20px calc(var(--sb) + 24px);opacity:0;transition:opacity .7s;overflow:hidden}

.pink{background:linear-gradient(165deg,#ff7aa5,#d81b60 55%,#7a0c3a)}
.dark{background:radial-gradient(90% 55% at 50% 105%,#7a3350aa,transparent),radial-gradient(80% 50% at 15% 0,#52307f99,transparent),#1d1030}
.dark::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff9,transparent),radial-gradient(1.5px 1.5px at 78% 14%,#fff9,transparent),radial-gradient(1px 1px at 40% 60%,#fff8,transparent),radial-gradient(1.5px 1.5px at 88% 72%,#fff8,transparent),radial-gradient(1px 1px at 25% 85%,#fff7,transparent)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes beat{50%{transform:scale(1.07)}}
@keyframes pulse{50%{opacity:.3}}
/* heart + bow */

.tag{position:absolute;top:max(calc(var(--st) + 96px),15%);left:0;right:0;font-style:italic;font-weight:700;letter-spacing:.5px;color:#b0506f}

.hwrap,.bwrap{position:absolute;width:0;height:0}.hwrap{left:50%;top:34%;--hw:min(28vw,130px)}.bwrap{left:27%;top:71%}
.glow{position:absolute;left:-46vw;top:-46vw;width:92vw;height:92vw;border-radius:50%;background:radial-gradient(closest-side,#ff4f86aa 0,#ff7aa066 35%,#ffb08a33 62%,#fff0 100%);animation:beat 2.4s ease-in-out infinite}
.heart{position:absolute;width:var(--hw);left:calc(var(--hw)*-.5);top:calc(var(--hw)*-.46);filter:drop-shadow(0 8px 16px #c2185b66);animation:beat 1.4s ease-in-out infinite}
.pop .heart{animation:pop .6s forwards}.pop .glow{animation:none;opacity:0;transition:opacity .8s}@keyframes pop{to{transform:scale(2);opacity:0}}

.fly{position:fixed;z-index:7;pointer-events:none;transition:transform .55s cubic-bezier(.3,0,.7,1)}

.ft{font-size:24px;font-weight:700;margin-bottom:6px}.sub{font-size:14px;opacity:.8;line-height:1.45;margin-bottom:10px}

.stack{position:absolute;left:0;right:0;bottom:0;height:3.6em;display:flex;flex-direction:column;gap:.2em;background:#2e170f;border-radius:.3em .3em .6em .6em;overflow:hidden;opacity:0;animation:fadein .5s forwards}
.stack b{flex:1;background:linear-gradient(#74483c,#62392f)}
.plate{position:absolute;left:-1.6em;right:-1.6em;bottom:-.35em;height:.28em;border-radius:.2em;background:#fbe9d0}
.ice{position:absolute;left:-.3em;right:-.3em;bottom:3.3em;height:1em;background:#fbe9d0;border-radius:.7em .7em .3em .3em;transform-origin:bottom}
.gone .ice{opacity:0;transform:scaleY(.25);transition:opacity .25s,transform .25s}
.ice i{position:absolute;top:.6em;width:.8em;height:var(--h);border-radius:0 0 .45em .45em;background:#fbe9d0;transform-origin:top;animation:dg .9s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--d) - .4s)}
.spread .ice i{animation-name:dg2}@keyframes dg{from{transform:scaleY(0)}}@keyframes dg2{from{transform:scaleY(0)}}
.dl{position:absolute;left:50%;bottom:3.3em;width:.9em;height:3em;transform:translateX(-50%);background:#fbe9d0;border-radius:.45em;opacity:0}
.blob .dl{animation:blobA .75s ease-out forwards}
@keyframes blobA{0%{opacity:1;width:.9em;height:3em;border-radius:.45em}
 22%{opacity:1;width:2.2em;height:3.5em;border-radius:50% 50% 42% 42%/68% 68% 32% 32%}
 45%{opacity:1;width:3.6em;height:2.4em;border-radius:50% 50% 35% 35%/75% 75% 25% 25%}
 70%{opacity:1;width:7em;height:1.4em;border-radius:50% 50% 30% 30%/80% 80% 20% 20%}

.stick{position:absolute;left:50%;bottom:4.3em;width:.9em;height:3.4em;margin-left:-.45em;background:#fbe9d0;border-radius:.45em;opacity:0}
.fall .stick{animation:sk .42s cubic-bezier(.5,0,.9,.6) forwards}@keyframes sk{from{opacity:1;transform:translateY(-36vh)}to{opacity:1;transform:translateY(.1em)}}
.blob .stick{animation:none;opacity:0}
.cd{position:absolute;left:50%;bottom:3.6em;width:.55em;height:0;margin-left:-.28em;background:linear-gradient(90deg,#fff,#efd8bd);border-radius:.15em .15em 0 0;transition:height .7s}.lit .cd{height:3.7em}
.fm{position:absolute;left:50%;top:-1.5em;width:.8em;height:1.3em;margin-left:-.4em;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff 15%,#ffd25a 55%,#ff8a2b);box-shadow:0 0 1.6em .5em #ffb84d88;opacity:0;transition:opacity .4s .6s;animation:fl .18s alternate infinite}.lit .fm{opacity:1}
@keyframes fl{to{transform:scale(1.1,.92) rotate(3deg)}}
#hb,#cm{position:relative;width:100%}#hb{margin-top:2.2em}#cm{margin-top:4px}
.hw2{font-family:var(--hand);font-size:clamp(22px,7.4vw,30px);line-height:1.2;color:#f6b042;min-height:38px}.sm3{font-size:15px;font-weight:600;opacity:.9;margin-top:10px;min-height:22px}
/* balloons */
.bs{justify-content:flex-end}.sp{flex:1}
.col{--u:min(calc(100vw - 40px),400px);display:flex;flex-direction:column;align-items:center;width:100%;max-width:400px;}
.topfade{position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 60px);background:linear-gradient(#27143c 45%,#27143c00);z-index:3;pointer-events:none}
.stage{position:relative;flex:none;width:38em;height:29em;font-size:clamp(5.5px,min(calc(var(--u)/34),calc((100vh - 440px - var(--st) - var(--sb))/29),calc((100dvh - 440px - var(--st) - var(--sb))/29)),22px);transition:height .6s,opacity .6s;margin-top:1.6em}.stage.gone{height:0;opacity:0}
.bl{font:inherit;position:absolute;left:var(--x);top:var(--y);width:8.2em;height:10.6em;border:0;padding:0;border-radius:50% 50% 50% 50%/56% 56% 44% 44%;background:radial-gradient(ellipse 22% 16% at 32% 24%,#ffffffd0 0,#fff0 100%),radial-gradient(circle at 35% 30%,#fff3 0,#fff0 40%),var(--c);box-shadow:inset -.8em -1em 1.6em #0003;animation:bob 3.4s ease-in-out infinite alternate}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:.14em;height:8em;background:#c9a9c0aa;transform:rotate(var(--tl));transform-origin:top}
@keyframes bob{to{transform:translateY(-1.2em) rotate(3deg)}}.bl.pop{animation:bpop .25s forwards}@keyframes bpop{to{transform:scale(1.5);opacity:0}}
.list{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rs{position:relative;border:1.5px solid var(--c);border-radius:16px;padding:9px 14px;text-align:left;background:linear-gradient(#3b1f3f99,#2b1634aa);box-shadow:0 0 18px -4px var(--c),inset 0 0 14px -8px var(--c);animation:up .5s both}
.rs::after{content:"✨";position:absolute;right:14px;bottom:12px;font-size:16px}
.rs em{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1px;color:#f6b042;background:#ffffff14;border-radius:8px;padding:3px 8px;margin-bottom:4px}.rs span{display:block;font-weight:700;font-size:15px;padding-right:26px}
.more{display:none;font-family:var(--hand);color:#f6b042;font-size:20px;margin-top:10px}.more.show{display:block}
.btn{margin-top:14px;border:0;border-radius:999px;padding:16px 38px;min-width:200px;font-weight:800;font-size:18px;font-family:inherit;color:#fff;background:linear-gradient(90deg,#ff7a5c,#ffb25c);box-shadow:0 10px 26px #ff7a5c55;opacity:0;pointer-events:none;transition:opacity .6s}
.btn.show{opacity:1;pointer-events:auto}.btn.ghost{background:#ffffff1a;box-shadow:none;border:1px solid #fff4;padding:12px 26px;min-width:0;font-size:15px}
.col .btn{display:none}.col .btn.show{display:block;width:100%}
/* envelope */
.env{position:relative;width:min(84vw,360px);height:calc(min(84vw,360px)/1.54);margin:34px 0 28px;perspective:700px;filter:drop-shadow(0 14px 22px #0006)}
.ev{position:absolute;left:0;top:0;width:100%;height:100%}.eb{background:#c8892b;z-index:0}
.paper{position:absolute;left:6%;top:6%;width:88%;height:86%;background:linear-gradient(#fff8ea,#fdecd0);border-radius:6px;z-index:1;transition:transform .9s .55s;padding-top:10px;font-size:24px;line-height:1.3}
.paper::after{content:"";display:block;margin:10px auto 0;width:80%;height:8px;border-radius:4px;background:#f3d9a8;box-shadow:0 14px 0 #f3d9a8}
.fl{clip-path:polygon(0 0,52% 54%,0 100%);background:linear-gradient(100deg,#eab048,#cf9030);z-index:2}
.fr{clip-path:polygon(100% 0,48% 54%,100% 100%);background:linear-gradient(260deg,#e0a03a,#bd7d22);z-index:2}
.fb{clip-path:polygon(0 100%,50% 52%,100% 100%);background:linear-gradient(#a26a1a,#d09636);z-index:3}
.flap{height:100%;clip-path:polygon(0 0,100% 0,50% 56%);background:linear-gradient(#f7c55e,#dd9c33);z-index:4;transform-origin:top;transition:transform .7s,z-index 0s .35s}
.seal{position:absolute;left:50%;top:56%;width:calc(min(84vw,360px)*.15);height:calc(min(84vw,360px)*.15);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd98a,#e29a30);border:2px solid #ffffffcc;box-shadow:0 3px 8px #0004;display:grid;place-items:center;font-size:24px;font-weight:600;color:#fff;z-index:5;transition:opacity .3s}
.open .flap{transform:rotateX(180deg);z-index:0;background:linear-gradient(#d29230,#b87a22)}.open .paper{transform:translateY(-52%)}.open .seal{opacity:0}
.em{position:absolute;left:50%;top:20%;z-index:6;font-size:20px;opacity:0;animation:ef 1.5s ease-out forwards}
@keyframes ef{15%{opacity:1}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rr))}}

.note h3{border-bottom:1px solid #eac98f;margin-bottom:8px}

</head>
<body>
<div id="app"></div><canvas id="fx"></canvas><button id="snd" hidden>🔊</button><div id="rot">📱 Please turn your phone upright 💛</div>
<script>
/* ============ EDIT THIS PART ============ */
const CONFIG={
  name:"Mushuuu!!!",            // her name
  sender:"Sahil",         // your name
  age:26,                     // the age she's turning
  reasons:[                   // balloon messages (5 recommended)
    "Your Single message fixes my worst days",
    "You notice the little things",
    "You believe in me, even when I don't",
    "Ordinary days feel special with you",
    "You are the pritiest Girl with Big Smile"
  ],
  letter:`I keep thinking about how lucky I am that Allah blessed me with you. Since you came into my life, everything has felt brighter, full of excitement and happiness. I don't say thank you nearly enough for that, but I promise to keep trying, with a whole lot of love and waffles 🤍

This year, I hope life is gentle with you, and that you feel even half as loved as you make me feel.

Happy birthday, my favourite person.`,

  const s=document.createElement('section');s.className='scene '+cls;s.innerHTML=html;app.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')));
  if(old){old.classList.remove('on');setTimeout(()=>old.remove(),800)}
  cur=s;init&&init(s)}
function next(){if(lock)return;lock=1;setTimeout(()=>lock=0,800);sc[++i]&&sc[i]()}
const tap=(s,ms)=>{let ok=0;later(()=>ok=1,ms||900);s.addEventListener('pointerup',()=>ok&&next())};
const HT="M50 88C10 58 2 36 2 24 2 11 12 2 25 2c10 0 20 6 25 14C55 8 65 2 75 2c13 0 23 9 23 22 0 12-8 34-48 64z";

const HEART=`<svg id="hrt" class="heart" viewBox="0 0 100 92"><defs><linearGradient id="hg" x1=".2" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#ffa9c8"/><stop offset=".55" stop-color="#f23d78"/><stop offset="1" stop-color="#c2124f"/></linearGradient><radialGradient id="hs"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><path fill="url(#hg)" d="${HT}"/><ellipse cx="31" cy="24" rx="12" ry="7" transform="rotate(-20 31 24)" fill="url(#hs)"/></svg>`;
const AR=`<line x1="70" y1="-50" x2="70" y2="58" stroke="#7a4a2e" stroke-width="3" stroke-linecap="round"/><path d="M70 60 61 74 70 67 79 74z" fill="#ec3d77"/><path d="M70 49 62 61 70 56 78 61z" fill="#ff7aa5"/><path d="M70-54 59-64 67-48zM70-54 81-64 73-48z" fill="#fff"/><circle cx="70" cy="-55" r="4.5" fill="#f6b042"/>`;
const BOW=`<svg viewBox="0 0 140 150" style="overflow:visible"><path d="M10 40C14 80 40 108 70 112 100 108 126 80 130 40" fill="none" stroke="#6e4228" stroke-width="5" stroke-linecap="round"/><rect x="62" y="103" width="16" height="15" rx="3" fill="#4a2c18"/><polyline id="str" points="10,40 70,40 130,40" fill="none" stroke="#d6b6a0" stroke-width="1.6"/><g id="ar">${AR}</g></svg>`;
const BL=[[3.7,2.7,'#f7a8c4','-2deg'],[12.3,7.3,'#a78bfa','3deg'],[20.1,.8,'#2ec4b6','-4deg'],[25.1,8.5,'#ff7f5c','2deg'],[6.7,13,'#f4c95d','4deg']];
const sc=[
/* 1 heart + bow */
()=>show(`<p class="tag">a little something, for you</p><div class="hwrap" id="hw"><div class="glow"></div>${HEART}</div><div class="bwrap" id="bw"><div id="bow">${BOW}</div></div><p class="hint">pull &amp; release</p>`,'light drag',s=>{
  const hw=$('#hw',s).getBoundingClientRect(),bw=$('#bw',s).getBoundingClientRect(),bow=$('#bow',s),str=$('#str',s),ar=$('#ar',s);
  const th=Math.atan2(hw.left-bw.left,bw.top-hw.top),ux=Math.sin(th),uy=-Math.cos(th);bow.style.setProperty('--th',th+'rad');
  let x0=0,y0=0,drag=0,fired=0;const set=p=>{str.setAttribute('points',`10,40 70,${40+p} 130,40`);ar.style.transform=`translateY(${p}px)`};
  s.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;drag=1});
  s.addEventListener('pointermove',e=>{if(drag&&!fired)set(Math.max(0,Math.min(38,-((e.clientX-x0)*ux+(e.clientY-y0)*uy)*.5)))});
  s.addEventListener('pointerup',()=>{if(!drag||fired)return;fired=1;
    const a=ar.getBoundingClientRect(),cx=a.left+a.width/2,cy=a.top+a.height/2,k=bow.offsetWidth/140,f=document.createElement('div');
    f.className='fly';f.style.cssText=`left:${cx-20*k}px;top:${cy-70*k}px;transform:translate(0,0) rotate(${th}rad)`;
    f.innerHTML=`<svg viewBox="50 -66 40 140" width="${40*k}" height="${140*k}" style="display:block">${AR}</svg>`;
    document.body.appendChild(f);ar.style.visibility='hidden';set(0);
    const dx=hw.left-cx-ux*25,dy=hw.top-cy-uy*25;
    requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.transform=`translate(${dx}px,${dy}px) rotate(${th}rad)`));
    later(()=>{f.remove();$('#hw',s).classList.add('pop');burst(hw.left,hw.top,70,1)},620);later(next,1700)})}),
/* 3 make a wish */
()=>show(`<p class="s1">make a wish…</p><h1 class="s2">Happy<br>Birthday</h1><p class="s3">to someone worth celebrating</p>`,'pink',s=>later(()=>{const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),1500);later(next,550)},3700)),
/* 4 heart tree */
()=>show(`<div class="rays" id="ry"></div><div class="crown" id="cr"></div><div class="trunk" id="tk"></div>${Array.from({length:12},()=>`<b class="petal" style="left:${(Math.random()*96)|0}%;font-size:${9+(Math.random()*9|0)}px;animation-duration:${(7+Math.random()*7).toFixed(1)}s;animation-delay:-${(Math.random()*9).toFixed(1)}s">♥</b>`).join('')}<div class="pnl"><p class="sm">it’s officially your day</p><h2>Happy Birthday,<br>${N}</h2><p class="sm2">and just like that, you’re turning ${A} ✨</p></div><p class="tap tap2">tap anywhere to continue</p>`,'light tr',s=>{
  const cr=$('#cr',s),f=n=>n.toFixed(2),O=[0,17],M=Math,hp=t=>[16*M.pow(M.sin(t),3),-(13*M.cos(t)-5*M.cos(2*t)-2*M.cos(3*t)-M.cos(4*t))];
  let sv='',hs='';const NB=30;
  for(let k=0;k<NB;k++){const t=.1+k*(6.083)/(NB-1),p=hp(t),r=k%2?.7:1,T=[p[0]*r,p[1]*r],dx=T[0]-O[0],dy=T[1]-O[1],L=M.hypot(dx,dy)||1,sg=k%4<2?1:-1,C=[O[0]+dx*.5-dy/L*3*sg,O[1]+dy*.5+dx/L*3*sg],d=.9+L/22*.9;
    sv+=`<path class="br" pathLength="1" stroke-width=".24" style="animation-delay:${f(d)}s" d="M0 17Q${f(C[0])} ${f(C[1])} ${f(T[0])} ${f(T[1])}"/>`;
    for(const u of [.55,.78]){const px=(1-u)*(1-u)*O[0]+2*u*(1-u)*C[0]+u*u*T[0],py=(1-u)*(1-u)*O[1]+2*u*(1-u)*C[1]+u*u*T[1],a=M.atan2(dy,dx)+(u<.7?1:-1)*sg*.7;
      sv+=`<path class="br" pathLength="1" stroke-width=".14" style="animation-delay:${f(d+.35*u)}s" d="M${f(px)} ${f(py)}L${f(px+M.cos(a)*L*.2)} ${f(py+M.sin(a)*L*.2)}"/>`}}
  for(let k=0;k<200;k++){const t=M.random()*6.283,r=k<70?.97+M.random()*.08:M.sqrt(M.random())*.95,p=hp(t),x=p[0]*r,y=p[1]*r,w=2.6+M.random()*1.9,dd=M.hypot(x,y-17)/30;
    hs+=`<i class="h${k%4}" style="left:${f((x+18)/36*100)}%;top:${f((y+14)/33*100)}%;width:${f(w)}em;height:${f(w*.92)}em;--r:${(M.random()*50-25)|0}deg;animation-delay:${f(1.9+dd*1.7+M.random()*.25)}s"></i>`}
  cr.innerHTML=`<svg viewBox="-18 -14 36 33">${sv}</svg>`+hs;
  const cb=cr.getBoundingClientRect(),sr=s.getBoundingClientRect(),ty=cb.top-sr.top+cb.height*.94,tk=$('#tk',s),ry=$('#ry',s);
  tk.style.top=ty+'px';tk.style.height=(sr.height-ty)+'px';ry.style.top=(cb.top-sr.top+cb.height*.42-ry.offsetHeight)+'px';tap(s,4300)}),
/* 5 cake */
()=>show(`<h2 class="ft cft">First things first 🎂</h2><div class="ck" id="ck"><div class="cd"><i class="fm"></i></div><div class="stack"><b></b><b></b><b></b></div><div class="ice">${[[6,1.5],[22,2.8],[38,1.1],[53,2.2],[68,1.4],[84,2.6]].map((v,k)=>`<i style="left:${v[0]}%;--h:${v[1]}em;--d:${(.5+k*.12).toFixed(2)}s"></i>`).join('')}</div><div class="dl"></div><div class="plate"></div><div class="stick"></div></div><p class="hw2" id="hb"></p><p class="sm3" id="cm">Baking something sweet…</p>`,'dark',s=>{
  const ck=$('#ck',s),cm=$('#cm',s),hb=$('#hb',s),T='Happy Birthday, '+CONFIG.name+'!';let ok=0;
  later(()=>ck.classList.add('gone'),1700);later(()=>ck.classList.add('fall'),2100);later(()=>{ck.classList.remove('fall');ck.classList.add('blob')},2520);
  later(()=>{ck.classList.remove('blob','gone');ck.classList.add('spread')},3270);
  later(()=>{ck.classList.add('lit');burst(W/2,H*.5,60);cm.textContent='Make a wish 🕯️';let k=0;const iv=setInterval(()=>{hb.textContent=T.slice(0,++k);if(k>=T.length){clearInterval(iv);later(()=>{cm.textContent='tap anywhere to continue';ok=1},900)}},70)},5400);
  s.addEventListener('pointerup',()=>ok&&next())}),
/* 6 balloons */
()=>show(`<div class="topfade"></div><div class="sp"></div><div class="col" id="col"><h2 class="ft">Pop the balloons 🎈</h2><p class="sub">${R.length} balloons. Each one holds a reason you’re loved.<br>Pop them all 🎈</p><div class="stage" id="stg">${R.map((r,k)=>{const b=BL[k%5];return `<button class="bl" data-k="${k}" aria-label="balloon" style="--x:${b[0]}em;--y:${b[1]}em;--c:${b[2]};--tl:${b[3]};animation-delay:-${(k*.7).toFixed(1)}s"></button>`}).join('')}</div><div class="list" id="ls"></div><p class="more" id="mo">…and a thousand more reasons 💛</p><button class="btn" id="go">Keep going 💛</button></div><div class="sp"></div>`,'dark bs',s=>{
  const col=$('#col',s),stg=$('#stg',s),ls=$('#ls',s),mo=$('#mo',s),go=$('#go',s);let n=0;
  const flip=fn=>{const t=col.getBoundingClientRect().top;fn();const d=t-col.getBoundingClientRect().top;if(d&&col.animate)col.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:450,easing:'ease-out'})};
  go.addEventListener('click',next);
  s.addEventListener('pointerdown',e=>{const b=e.target.closest('.bl');if(!b||b.classList.contains('pop'))return;
    const r=b.getBoundingClientRect(),k=n++;burst(r.left+r.width/2,r.top+r.height/2,26);b.classList.add('pop');setTimeout(()=>b.remove(),250);
    flip(()=>{const d=document.createElement('div');d.className='rs';d.style.setProperty('--c',BC[k%5]);d.innerHTML=`<em>REASON NO.${k+1} 💘</em><span>${esc(R[k])}</span>`;ls.appendChild(d)});
    if(n==R.length)later(()=>flip(()=>{stg.classList.add('gone');mo.classList.add('show');go.classList.add('show')}),800)})}),
/* 9 NEW: photos */
()=>show(`<h2 class="ft">Some of my favourite moments 📸</h2><div class="car" id="car">${PH.map((p,k)=>`<figure class="ph" style="--r:${k%2?2:-2}deg;animation-delay:${(.3+k*.2).toFixed(1)}s"><div class="img"><span>📷<br>Add photo ${k+1}</span><img class="bg" src="${esc(p.src)}" alt="" onerror="this.remove()"><img src="${esc(p.src)}" alt="" onerror="this.remove()"></div><figcaption>${esc(p.caption||'')}</figcaption></figure>`).join('')}</div><div class="dots" id="dt">${PH.map(()=>'<i></i>').join('')}</div><button class="btn show" id="go">Continue</button>`,'dark',s=>{
  const car=$('#car',s),ds=[...s.querySelectorAll('#dt i')];
  const up=()=>{const m=car.scrollWidth-car.clientWidth||1,k=Math.round(car.scrollLeft/m*(PH.length-1));ds.forEach((d,j)=>d.classList.toggle('on',j==k))};
  car.addEventListener('scroll',up);up();$('#go',s).addEventListener('click',next)}),
/* 7 envelope */
()=>show(`<h2 class="ft">One last thing, ${N}…</h2><p class="sub">${S} wrote you a letter.</p><div class="env" id="env"><div class="ev eb"></div><div class="paper">🎂</div><div class="ev fl"></div><div class="ev fr"></div><div class="ev fb"></div><div class="ev flap"></div><div class="seal">${esc((CONFIG.name||'?')[0].toUpperCase())}</div></div><p class="tap">👆<br>Tap to open your letter</p>`,'dark',s=>{
  let op=0;s.addEventListener('pointerup',()=>{if(op)return;op=1;const e=$('#env',s);e.classList.add('open');
    ['🎉','💛','✨','🎈','🎂','💌','✨','💛'].forEach((c,k)=>{const m=document.createElement('span');m.className='em';m.textContent=c;m.style.cssText=`--dx:${(k-3.5)*22}px;--dy:${-70-Math.random()*60}px;--rr:${(Math.random()*60-30)|0}deg;animation-delay:${.7+k*.07}s`;e.appendChild(m)});
    later(next,2300)})}),
/* 8 letter */
()=>show(`<div class="note" id="nt"><h3>Dear ${N},</h3><p id="tx"></p><p class="sig" id="sg">${esc(CONFIG.signoff)}<br>— ${S}</p><b class="cb">🎂</b></div><button class="btn" id="go">Continue</button>`,'dark',s=>{
  const tx=$('#tx',s),nt=$('#nt',s),L=[...CONFIG.letter];let k=0,done=0,iv;
  const fin=()=>{if(done)return;done=1;clearInterval(iv);tx.textContent=CONFIG.letter;$('#sg',s).classList.add('show');$('#go',s).classList.add('show');nt.scrollTop=nt.scrollHeight};
  iv=setInterval(()=>{k++;const j=Math.max(0,k-6);tx.innerHTML=esc(L.slice(0,j).join(''))+'<span class="g">'+esc(L.slice(j,k).join(''))+'</span>';nt.scrollTop=nt.scrollHeight;if(k>=L.length)fin()},36);
  s.addEventListener('pointerup',fin);$('#go',s).addEventListener('click',next)}),
/* 10 finale */
()=>show(`<h1 class="fin">HAPPY<br>BIRTHDAY<em>${N}!</em></h1><div class="big2">🎁</div><p class="sm3">Made with love, just for you — <b>${S}</b> 💛</p><button class="btn ghost show" id="rp">Replay ↺</button>`,'dark',s=>{
  rain=1;loop();burst(W/2,H*.4,100,1);$('#rp',s).addEventListener('click',()=>{rain=0;i=-1;next()})})
];
/* sound (optional) + iOS touch behaviour */
const au=CONFIG.music?Object.assign(new Audio(CONFIG.music),{loop:true,volume:.5}):null,sb=$('#snd');
if(au){sb.hidden=false;sb.onclick=()=>{au.muted=!au.muted;sb.textContent=au.muted?'🔇':'🔊'}}
['pointerup','touchend','click'].forEach(ev=>addEventListener(ev,()=>{if(au&&au.paused&&!au.muted)au.play().catch(()=>{})},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(au){if(document.hidden)au.pause();else if(!au.muted)au.play().catch(()=>{})}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.list,.note,.car'))e.preventDefault()},{passive:false});
next();
</script>
